<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaSenzor - Professional Climate Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-app: #F8FAFC;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --color-accent: #0284C7;
            --color-accent-glow: rgba(2, 132, 199, 0.1);
        }
        .dark {
            --bg-app: #0B1329;
            --bg-card: #131C35;
            --border-color: #1E294B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --color-accent: #38BDF8;
            --color-accent-glow: rgba(56, 189, 248, 0.15);
        }
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 10px 25px -5px var(--color-accent-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased selection:bg-sky-500/20">

    <div id="root"></div>

    <script type="text/babel">

        // --- SUB-KOMPONENT: METRICKÁ KARTA ---
        function MetricCard({ title, value, unit, icon, trend, isSelected, onClick }) {
            return (
                <div 
                    onClick={onClick}
                    className={`custom-card p-5 rounded-2xl cursor-pointer relative overflow-hidden ${isSelected ? 'ring-2 ring-[var(--color-accent)] border-transparent' : ''}`}
                >
                    <div className="flex justify-between items-start mb-3">
                        <span className="text-xs uppercase tracking-wider font-semibold text-[var(--text-muted)]">{title}</span>
                        <span className="text-2xl p-2 bg-slate-100 dark:bg-slate-800/50 rounded-xl">{icon || '📊'}</span>
                    </div>
                    <div className="flex items-baseline gap-1">
                        <span className="text-3xl font-bold tracking-tight">{value ?? '--'}</span>
                        <span className="text-sm font-medium text-[var(--text-muted)]">{unit}</span>
                    </div>
                    <div className="mt-3 flex items-center gap-1.5 text-xs font-medium">
                        <span className="text-sky-500">
                            ● {trend?.text || 'Senzor aktívny'}
                        </span>
                    </div>
                </div>
            );
        }

        // --- SUB-KOMPONENT: DYNAMICKÝ SVG GRAF ---
        function DynamicHistoryChart({ metricName, historyData = [], unit }) {
            if (!historyData || historyData.length === 0) {
                return <p className="text-xs text-[var(--text-muted)] italic p-4">Pre túto veličinu nie sú v databáze dostupné historické záznamy.</p>;
            }

            const width = 600;
            const height = 220;
            const padding = 40;

            const maxX = historyData.length - 1 || 1;
            const values = historyData.map(d => d?.value ?? d ?? 0);
            const minY = Math.min(...values) - (Math.abs(Math.min(...values)) * 0.05 || 1);
            const maxY = Math.max(...values) + (Math.abs(Math.max(...values)) * 0.05 || 1);

            const points = historyData.map((d, index) => {
                const val = d?.value ?? d ?? 0;
                const label = d?.time || `${index}:00`;
                const x = padding + (index / maxX) * (width - padding * 2);
                const y = height - padding - ((val - minY) / ((maxY - minY) || 1)) * (height - padding * 2);
                return { x, y, label, val };
            });

            const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');
            const areaD = points.length > 0 ? `${pathD} L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z` : '';

            return (
                <div className="w-full bg-slate-50 dark:bg-slate-900/40 p-4 rounded-xl border border-dashed border-[var(--border-color)]">
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-xs uppercase tracking-wider font-bold text-[var(--text-muted)]">História zmien: {metricName}</span>
                        <span className="text-xs bg-sky-500/10 text-sky-500 px-2.5 py-1 rounded-full font-semibold">Aktualizované z DB</span>
                    </div>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
                        <defs>
                            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="var(--color-accent)" stopOpacity={0.25} />
                                <stop offset="100%" stopColor="var(--color-accent)" stopOpacity={0} />
                            </linearGradient>
                        </defs>
                        
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="var(--border-color)" strokeWidth={1} strokeDasharray="4" opacity={0.5} />
                        <line x1={padding} y1={height/2} x2={width-padding} y2={height/2} stroke="var(--border-color)" strokeWidth={1} strokeDasharray="4" opacity="0.5" />
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="var(--border-color)" strokeWidth={1} opacity="0.5" />

                        {points.length > 0 && <path d={areaD} fill="url(#chartGradient)" />}
                        {points.length > 0 && <path d={pathD} fill="none" stroke="var(--color-accent)" strokeWidth={3} strokeLinecap="round" />}
                        
                        {points.map((p, i) => (
                            <g key={i} className="group/point cursor-pointer">
                                <circle cx={p.x} cy={p.y} r={4} fill="var(--bg-card)" stroke="var(--color-accent)" strokeWidth={2} />
                                <circle cx={p.x} cy={p.y} r="8" fill="var(--color-accent)" opacity="0" className="hover:opacity-20 transition-opacity" />
                                <text x={p.x} y={p.y - 12} fill="var(--text-main)" fontSize={10} fontWeight="600" textAnchor="middle" className="opacity-0 group-hover/point:opacity-100 transition-opacity">
                                    {p.val}{unit}
                                </text>
                                <text x={p.x} y={height - 15} fill="var(--text-muted)" fontSize={9} textAnchor="middle">
                                    {p.label}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        }

        // --- HLAVNÁ APLIKÁCIA ---
        function GaiaSenzorApp() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [selectedMetric, setSelectedMetric] = React.useState('temperature');
            const [locationName, setLocationName] = React.useState('Načítavam stanicu...');
            const [metricsObj, setMetricsObj] = React.useState({});

            React.useEffect(() => {
                // Požiadavka priamo na tvoj lokálny backend, ktorý zlučuje oba zdroje
                fetch('/api/dashboard')
                    .then(response => {
                        if (!response.ok) throw new Error("Chyba servera");
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.metrics) {
                            setMetricsObj(data.metrics);
                            setLocationName(data.location);
                        }
                    })
                    .catch(error => {
                        console.error("Fetch zlyhal, uisti sa, že ti beží FastAPI:", error);
                        setLocationName("Chyba spojenia s backendom");
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            const activeMetricData = metricsObj[selectedMetric] || { title: selectedMetric, value: '--', unit: '', icon: '📊', history: [] };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* HORNÁ LIŠTA */}
                    <header className="bg-slate-950 text-white p-5 px-8 flex items-center justify-between border-b border-slate-800">
                        <div className="flex items-center gap-4">
                            <span className="text-2xl">⚡</span>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">GaiaSenzor Core</h1>
                                <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Meteostanica & Meranie Kveta</p>
                            </div>
                        </div>
                        <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-800 text-amber-400 text-sm">
                            {darkMode ? '☀️ Svetlý režim' : '🌙 Tmavý režim'}
                        </button>
                    </header>

                    {/* HLAVNÝ OBSAH */}
                    <main className="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto space-y-6">
                        <div className="border-b border-[var(--border-color)] pb-4">
                            <p className="text-xs uppercase tracking-wider font-bold text-sky-500">Aktuálne monitorovaný uzol</p>
                            <h2 className="text-2xl font-bold tracking-tight">{locationName}</h2>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* ĽAVÁ STRANA: KLIKATEĽNÉ METRIKY */}
                            <div className="lg:col-span-2 space-y-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Aktuálne stavy senzorov</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {Object.keys(metricsObj).map(key => {
                                        const item = metricsObj[key];
                                        return (
                                            <MetricCard 
                                                key={key}
                                                title={item.title}
                                                value={item.value}
                                                unit={item.unit}
                                                icon={item.icon}
                                                trend={item.trend}
                                                isSelected={selectedMetric === key}
                                                onClick={() => setSelectedMetric(key)}
                                            />
                                        );
                                    })}
                                </div>
                            </div>

                            {/* PRAVÁ STRANA: HISTORICKÝ GRAF DYNAMICKY PODĽA SELEKCIE */}
                            <div className="space-y-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Detail a história merania</h3>
                                <div className="custom-card p-6 rounded-2xl shadow-sm h-full flex flex-col justify-between gap-6">
                                    <div>
                                        <div className="text-xs text-sky-500 uppercase tracking-wider font-bold mb-1">Zvolená veličina</div>
                                        <h4 className="font-bold text-xl">{activeMetricData.title}</h4>
                                        <div className="text-4xl font-extrabold my-3">
                                            {activeMetricData.value} <span className="text-lg font-normal text-[var(--text-muted)]">{activeMetricData.unit}</span>
                                        </div>
                                    </div>
                                    
                                    <DynamicHistoryChart 
                                        metricName={activeMetricData.title}
                                        historyData={activeMetricData.history}
                                        unit={activeMetricData.unit}
                                    />
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GaiaSenzorApp />);
    </script>
</body>
</html>
