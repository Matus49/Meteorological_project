<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>GaiaSenzor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">
    <h1 class="text-4xl font-black text-emerald-500 mb-10 text-center">GaiaSenzor Monitoring</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
        <div class="bg-slate-900 p-6 rounded-2xl border border-sky-900">
            <h2 class="text-sky-400 font-bold text-xl mb-4">📍 Vonkajšie prostredie</h2>
            <div id="out-vals" class="space-y-2">
                <p>Teplota: <span id="out-t" class="font-bold">--</span> °C</p>
                <p>Vlhkosť: <span id="out-h" class="font-bold">--</span> %</p>
            </div>
        </div>
        <div class="bg-slate-900 p-6 rounded-2xl border border-amber-900">
            <h2 class="text-amber-400 font-bold text-xl mb-4">🏫 IT Učebňa</h2>
            <div id="in-vals" class="space-y-2">
                <p>Teplota: <span id="in-t" class="font-bold">--</span> °C</p>
                <p>Vlhkosť: <span id="in-h" class="font-bold">--</span> %</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchAll() {
            try {
                const res = await fetch('https://meteorological-project.onrender.com/api/dashboard');
                const data = await res.json();
                
                // Vonkajšok
                document.getElementById('out-t').innerText = data.outside.current.temp;
                document.getElementById('out-h').innerText = data.outside.current.humidity;
                
                // Učebňa
                document.getElementById('in-t').innerText = data.classroom.current.temp;
                document.getElementById('in-h').innerText = data.classroom.current.humidity;
                
                console.log("Dáta úspešne načítané");
            } catch(e) { console.error("Chyba:", e); }
        }
        fetchAll();
        setInterval(fetchAll, 30000);
    </script>
</body>
</html>
