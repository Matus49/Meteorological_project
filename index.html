<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaSenzor | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#0b1221] text-white min-h-screen font-sans">

    <header class="p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-tighter">GaiaSenzor <span class="text-blue-500">Core</span></h1>
        <input type="text" placeholder="Filtrovať senzory..." class="glass rounded-full px-4 py-2 text-sm w-64 focus:outline-none focus:ring-2 ring-blue-500">
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-12 gap-6">
        <aside class="col-span-3 space-y-4">
            <div class="glass p-4 rounded-2xl">
                <h2 class="text-xs uppercase text-slate-400 mb-3">Kamera 1</h2>
                <img id="cam0" src="https://projekttb.sksnr.sk/data/camera.php?cam=0" class="rounded-xl w-full">
            </div>
            <div class="glass p-4 rounded-2xl">
                <h2 class="text-xs uppercase text-slate-400 mb-3">Kamera 2</h2>
                <img id="cam1" src="https://projekttb.sksnr.sk/data/camera.php?cam=1" class="rounded-xl w-full">
            </div>
        </aside>

        <section class="col-span-9 space-y-6">
            <div id="main-sensors" class="grid grid-cols-4 gap-4"></div>

            <div id="secondary-sensors" class="grid grid-cols-4 gap-4"></div>
        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/dashboard'; // Zmeň na svoju URL

        async function updateDashboard() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                renderCards('main-sensors', data.main_sensors, true);
                renderCards('secondary-sensors', data.secondary_sensors, false);
            } catch (e) { console.error("Chyba API:", e); }
        }

        function renderCards(containerId, data, isMain) {
            const container = document.getElementById(containerId);
            container.innerHTML = Object.entries(data).map(([key, val]) => `
                <div class="glass p-5 rounded-2xl ${isMain ? 'h-32' : 'h-24'} hover:border-blue-500 transition-all cursor-pointer">
                    <p class="text-[10px] text-slate-400 uppercase">${val.title}</p>
                    <p class="text-2xl font-bold mt-1">${val.val} <span class="text-sm font-normal opacity-50">${val.unit || ''}</span></p>
                </div>
            `).join('');
        }

        // Auto-refresh kamier (každých 5 sekúnd)
        setInterval(() => {
            const time = new Date().getTime();
            document.getElementById('cam0').src = `https://projekttb.sksnr.sk/data/camera.php?cam=0&t=${time}`;
            document.getElementById('cam1').src = `https://projekttb.sksnr.sk/data/camera.php?cam=1&t=${time}`;
        }, 5000);

        setInterval(updateDashboard, 30000);
        updateDashboard();
        lucide.createIcons();
    </script>
</body>
</html>
