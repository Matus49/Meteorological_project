<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaSenzor - Professional Weather & Climate Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-app: #F8FAFC;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --color-accent: #0284C7;
            --color-accent-glow: rgba(2, 132, 199, 0.1);
        }

        .dark {
            --bg-app: #0B1329;
            --bg-card: #131C35;
            --border-color: #1E294B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --color-accent: #38BDF8;
            --color-accent-glow: rgba(56, 189, 248, 0.15);
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .custom-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 10px 25px -5px var(--color-accent-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased selection:bg-sky-500/20">

    <div id="root"></div>

    <script type="text/babel">

        // --- SUB-KOMPONENT: METRICKÁ KARTA ---
        function MetricCard({ title, value, unit, icon, trend, isSelected, onClick }) {
            const isPositive = trend.type === 'good' || trend.type === 'up';
            return (
                <div 
                    onClick={onClick}
                    class={`custom-card p-5 rounded-2xl cursor-pointer relative overflow-hidden ${isSelected ? 'ring-2 ring-[var(--color-accent)] border-transparent' : ''}`}
                >
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs uppercase tracking-wider font-semibold text-[var(--text-muted)]">{title}</span>
                        <span class="text-2xl p-2 bg-slate-100 dark:bg-slate-800/50 rounded-xl">{icon}</span>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold tracking-tight">{value}</span>
                        <span class="text-sm font-medium text-[var(--text-muted)]">{unit}</span>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 text-xs font-medium">
                        <span class={isPositive ? 'text-emerald-500' : 'text-amber-500'}>
                            {trend.type === 'up' ? '↑' : trend.type === 'down' ? '↓' : '●'} {trend.text}
                        </span>
                    </div>
                </div>
            );
        }

        // --- SUB-KOMPONENT: DYNAMICKÝ SVG GRAF ---
        function DynamicHistoryChart({ metricName, historyData, unit }) {
            if (!historyData || historyData.length === 0) return null;

            const width = 600;
            const height = 220;
            const padding = 40;

            const minX = 0;
            const maxX = historyData.length - 1;
            const values = historyData.map(d => d.value);
            const minY = Math.min(...values) - (Math.min(...values) * 0.1);
            const maxY = Math.max(...values) + (Math.max(...values) * 0.1);

            // Výpočet bodov pre SVG
            const points = historyData.map((d, index) => {
                const x = padding + (index / maxX) * (width - padding * 2);
                const y = height - padding - ((d.value - minY) / (maxY - minY)) * (height - padding * 2);
                return { x, y, label: d.time, val: d.value };
            });

            const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');
            const areaD = `${pathD} L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z`;

            return (
                <div class="w-full bg-slate-50 dark:bg-slate-900/40 p-4 rounded-xl border border-dashed border-[var(--border-color)]">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs uppercase tracking-wider font-bold text-[var(--text-muted)]">História: {metricName}</span>
                        <span class="text-xs bg-sky-500/10 text-sky-500 px-2.5 py-1 rounded-full font-semibold">Zobrazené v reálnom čase</span>
                    </div>
                    <svg viewBox={`0 0 ${width} ${height}`} class="w-full h-auto overflow-visible">
                        <defs>
                            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.25" />
                                <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        
                        {/* Pomocné mriežky */}
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="var(--border-color)" stroke-width="1" stroke-dasharray="4" opacity="0.5" />
                        <line x1={padding} y1={height/2} x2={width-padding} y2={height/2} stroke="var(--border-color)" stroke-width="1" stroke-dasharray="4" opacity="0.5" />
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="var(--border-color)" stroke-width="1" opacity="0.5" />

                        {/* Vyplnená plocha a hlavná krivka */}
                        <path d={areaD} fill="url(#chartGradient)" />
                        <path d={pathD} fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" />
                        
                        {/* Interaktívne body */}
                        {points.map((p, i) => (
                            <g key={i} class="group/point cursor-pointer">
                                <circle cx={p.x} cy={p.y} r="5" fill="var(--bg-card)" stroke="var(--color-accent)" stroke-width="2" />
                                <circle cx={p.x} cy={p.y} r="9" fill="var(--color-accent)" opacity="0" class="hover:opacity-20 transition-opacity" />
                                <text x={p.x} y={p.y - 12} fill="var(--text-main)" font-size="11" font-weight="600" text-anchor="middle" class="opacity-0 group-hover/point:opacity-100 transition-opacity bg-slate-900">
                                    {p.val}{unit}
                                </text>
                                <text x={p.x} y={height - 15} fill="var(--text-muted)" font-size="10" text-anchor="middle">
                                    {p.label}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        }

        // --- HLAVNÁ APLIKÁCIA ---
        function GaiaSenzorApp() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedMetric, setSelectedMetric] = React.useState('temperature');
            
            // Štruktúrované živé a historické dáta pre jednotlivé veličiny
            const [data, setData] = React.useState({
                station_name: "GaiaSenzor Core v2",
                location: "Bratislava, Slovensko",
                metrics: {
                    temperature: { title: "Teplota vzduchu", value: 17.6, unit: "°C", icon: "🌡️", trend: { text: "Stabilná", type: "good" },
                        history: [{time:"08:00", value:14.2}, {time:"10:00", value:15.5}, {time:"12:00", value:16.8}, {time:"14:00", value:17.6}, {time:"16:00", value:17.1}] },
                    humidity: { title: "Vlhkosť vonku", value: 68, unit: "%", icon: "💧", trend: { text: "Mierne stúpa", type: "up" },
                        history: [{time:"08:00", value:72}, {time:"10:00", value:70}, {time:"12:00", value:65}, {time:"14:00", value:68}, {time:"16:00", value:69}] },
                    pressure: { title: "Atmosférický tlak", value: 1016, unit: "hPa", icon: "⏱️", trend: { text: "V norme", type: "good" },
                        history: [{time:"08:00", value:1014}, {time:"10:00", value:1015}, {time:"12:00", value:1016}, {time:"14:00", value:1016}, {time:"16:00", value:1017}] },
                    ghi: { title: "Solárne žiarenie GHI", value: 512, unit: "W/m²", icon: "☀️", trend: { text: "Jasno", type: "good" },
                        history: [{time:"08:00", value:120}, {time:"10:00", value:340}, {time:"12:00", value:512}, {time:"14:00", value:480}, {time:"16:00", value:210}] },
                    wind: { title: "Rýchlosť vetra", value: 18, unit: "km/h", icon: "💨", trend: { text: "Čerstvý vietor", type: "warn" },
                        history: [{time:"08:00", value:12}, {time:"10:00", value:15}, {time:"12:00", value:18}, {time:"14:00", value:16}, {time:"16:00", value:14}] },
                    rain: { title: "Zrážky (1h)", value: 0.2, unit: "mm", icon: "🌧️", trend: { text: "Prehánky", type: "warn" },
                        history: [{time:"08:00", value:0.0}, {time:"10:00", value:0.0}, {time:"12:00", value:0.2}, {time:"14:00", value:0.1}, {time:"16:00", value:0.0}] }
                },
                classrooms: [
                    { id: "A204", name: "Učebňa Informatiky (A204)", co2: 850, temperature: 21.8, humidity: 45, door_open: false, status: "Ideálne" },
                    { id: "B101", name: "Fyzikálne Laboratórium (B101)", co2: 1350, temperature: 23.1, humidity: 52, door_open: true, status: "Vyvetrať!" },
                    { id: "C302", name: "Ateliér Estetiky (C302)", co2: 580, temperature: 20.5, humidity: 40, door_open: false, status: "Excelentné" }
                ]
            });

            // Živé načítanie dát z tvojho Render API
            React.useEffect(() => {
                fetch('https://meteorological-project.onrender.com/api/dashboard')
                    .then(response => {
                        if (!response.ok) throw new Error("Chyba pri sťahovaní dát zo servera");
                        return response.json();
                    })
                    .then(realData => {
                        setData(realData);
                    })
                    .catch(error => {
                        console.error("Nepodarilo sa načítať živé dáta, zostávajú pôvodné:", error);
                    });
            }, []);

            // Synchronizácia dark módu s HTML elementom
            React.useEffect(() => {
                const rootHtml = document.documentElement;
                if (darkMode) {
                    rootHtml.classList.add('dark');
                } else {
                    rootHtml.classList.remove('dark');
                }
            }, [darkMode]);

            // Globálne vyhodnotenie stavu klímy budovy
            const evaluateGlobalStatus = () => {
                const criticalRooms = data.classrooms.filter(r => r.co2 > 1200);
                if (criticalRooms.length > 0) {
                    return {
                        message: `⚠️ Pozor: Zvýšená koncentrácia CO2 v ${criticalRooms.map(r => r.id).join(', ')}. Odporúča sa vyvetrať učebne.`,
                        type: "warn"
                    };
                }
                return { message: "✨ Klíma vo vnútorných priestoroch školy je momentálne optimálna.", type: "good" };
            };

            const globalStatus = evaluateGlobalStatus();

            // Funkcia na reálny export dát do formátu CSV
            const handleExportCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "Velicina,Cas,Hodnota\n";
                
                Object.keys(data.metrics).forEach(key => {
                    const metric = data.metrics[key];
                    metric.history.forEach(h => {
                        csvContent += `"${metric.title}","${h.time}","${h.value}"\n`;
                    });
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `meteo_export_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div class="min-h-screen flex flex-col lg:flex-row">
                    
                    <aside class="w-full lg:w-64 bg-slate-900 text-slate-100 p-6 flex flex-col justify-between border-r border-slate-800 shrink-0">
                        <div>
                            <div class="mb-10 flex items-center justify-between">
                                <div>
                                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                        <span class="text-sky-400">⚡</span> GaiaSenzor
                                    </h1>
                                    <p class="text-[10px] uppercase tracking-widest text-slate-400 mt-1 font-bold">Školská Eko-Metrika</p>
                                </div>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)} 
                                    class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 transition-colors text-amber-400"
                                    title="Prepnúť režim"
                                >
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>

                            <nav class="space-y-1.5">
                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    class={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium text-sm ${activeTab === 'dashboard' ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/20' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100'}`}
                                >
                                    📊 Riadiaci panel
                                </button>
                                <button 
                                    onClick={() => setActiveTab('rooms')} 
                                    class={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium text-sm ${activeTab === 'rooms' ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/20' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100'}`}
                                >
                                    🏫 Interiér tried
                                </button>
                            </nav>
                        </div>

                        <div class="mt-8 pt-4 border-t border-slate-800 flex flex-col gap-3">
                            <div class="flex items-center gap-2 text-xs text-slate-400">
                                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                                IoT Brána: Pripojená
                            </div>
                            <button 
                                onClick={handleExportCSV}
                                class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                            >
                                📥 Exportovať CSV dáta
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto overflow-y-auto space-y-6">
                        
                        {/* HORNÝ PANEL S LOKALITOU A GLOBÁLNYM STATUSOM */}
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-[var(--border-color)] pb-5">
                            <div>
                                <p class="text-xs uppercase tracking-wider font-bold text-sky-500">Lokalita a Uzol stanice</p>
                                <h2 class="text-2xl font-bold tracking-tight">{data.location}</h2>
                            </div>
                            
                            {/* Globálny Stavový Panel */}
                            <div class={`px-4 py-3 rounded-xl border text-sm font-medium shadow-sm max-w-md ${globalStatus.type === 'warn' ? 'bg-amber-500/10 border-amber-500/20 text-amber-600 dark:text-amber-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-600 dark:text-emerald-400'}`}>
                                {globalStatus.message}
                            </div>
                        </div>

                        {activeTab === 'dashboard' ? (
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                
                                <div class="lg:col-span-2 space-y-4">
                                    <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Meteostanica (Exteriér)</h3>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {Object.keys(data.metrics).map(key => {
                                            const item = data.metrics[key];
                                            return (
                                                <MetricCard 
                                                    key={key}
                                                    title={item.title}
                                                    value={item.value}
                                                    unit={item.unit}
                                                    icon={item.icon}
                                                    trend={item.trend}
                                                    isSelected={selectedMetric === key}
                                                    onClick={() => setSelectedMetric(key)}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>

                                <div class="space-y-4">
                                    <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Analytický náhľad</h3>
                                    <div class="custom-card p-6 rounded-2xl shadow-sm h-full flex flex-col justify-between gap-6">
                                        <div>
                                            <div class="flex items-center gap-3 mb-2">
                                                <span class="text-3xl p-1 bg-sky-500/10 rounded-xl">{data.metrics[selectedMetric].icon}</span>
                                                <div>
                                                    <h4 class="font-bold text-lg">{data.metrics[selectedMetric].title}</h4>
                                                    <p class="text-xs text-[var(--text-muted)]">Aktuálny vybraný senzor pre hĺbkovú analýzu</p>
                                                </div>
                                            </div>
                                            <div class="text-4xl font-extrabold my-4">
                                                {data.metrics[selectedMetric].value} <span class="text-lg font-normal text-[var(--text-muted)]">{data.metrics[selectedMetric].unit}</span>
                                            </div>
                                        </div>

                                        {/* Dynamické vykreslenie SVG Grafu podľa vybratej karty */}
                                        <DynamicHistoryChart 
                                            metricName={data.metrics[selectedMetric].title}
                                            historyData={data.metrics[selectedMetric].history}
                                            unit={data.metrics[selectedMetric].unit}
                                        />
                                    </div>
                                </div>

                            </div>
                        ) : (
                            
                            <div class="space-y-4">
                                <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Klíma v učebniach</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {data.classrooms.map(room => {
                                        const isCritical = room.co2 > 1200;
                                        return (
                                            <div key={room.id} class={`custom-card p-6 rounded-2xl shadow-sm relative ${isCritical ? 'border-amber-500/40 ring-4 ring-amber-500/5' : ''}`}>
                                                <div class="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h4 class="font-bold text-base">{room.name}</h4>
                                                        <span class="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded font-mono text-[var(--text-muted)]">ID: {room.id}</span>
                                                    </div>
                                                    <span class={`text-xs px-2.5 py-1 rounded-full font-semibold ${room.door_open ? 'bg-sky-500/10 text-sky-500' : 'bg-slate-500/10 text-slate-400'}`}>
                                                        {room.door_open ? "🔓 Dvere Otvorené" : "🔒 Zatvorené"}
                                                    </span>
                                                </div>

                                                <div class="space-y-3 my-5 text-sm">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[var(--text-muted)]">Oxid uhličitý (CO2):</span>
                                                        <span class={`font-bold ${isCritical ? 'text-amber-500 animate-pulse' : ''}`}>{room.co2} ppm</span>
                                                    </div>
                                                    <div class="flex justify-between">
                                                        <span class="text-[var(--text-muted)]">Teplota v triede:</span>
                                                        <span class="font-semibold">{room.temperature} °C</span>
                                                    </div>
                                                    <div class="flex justify-between">
                                                        <span class="text-[var(--text-muted)]">Vlhkosť vzduchu:</span>
                                                        <span class="font-semibold">{room.humidity} %</span>
                                                    </div>
                                                </div>

                                                <div class="pt-4 border-t border-[var(--border-color)] flex items-center justify-between text-xs">
                                                    <span class="text-[var(--text-muted)] font-medium">Stav prostredia:</span>
                                                    <span class={`font-bold uppercase tracking-wider ${isCritical ? 'text-amber-500' : 'text-emerald-500'}`}>{room.status}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GaiaSenzorApp />);
    </script>
</body>
</html>
