<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaSenzor - Professional Weather & Climate Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-app: #F8FAFC;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --color-accent: #0284C7;
            --color-accent-glow: rgba(2, 132, 199, 0.1);
        }
        .dark {
            --bg-app: #0B1329;
            --bg-card: #131C35;
            --border-color: #1E294B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --color-accent: #38BDF8;
            --color-accent-glow: rgba(56, 189, 248, 0.15);
        }
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 10px 25px -5px var(--color-accent-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased selection:bg-sky-500/20">

    <div id="root"></div>

    <script type="text/babel">

        // --- SUB-KOMPONENT: METRICKÁ KARTA ---
        function MetricCard({ title, value, unit, icon, trend, isSelected, onClick }) {
            const isPositive = trend?.type === 'good' || trend?.type === 'up';
            return (
                <div 
                    onClick={onClick}
                    className={`custom-card p-5 rounded-2xl cursor-pointer relative overflow-hidden ${isSelected ? 'ring-2 ring-[var(--color-accent)] border-transparent' : ''}`}
                >
                    <div className="flex justify-between items-start mb-3">
                        <span className="text-xs uppercase tracking-wider font-semibold text-[var(--text-muted)]">{title}</span>
                        <span className="text-2xl p-2 bg-slate-100 dark:bg-slate-800/50 rounded-xl">{icon || '📊'}</span>
                    </div>
                    <div className="flex items-baseline gap-1">
                        <span className="text-3xl font-bold tracking-tight">{value ?? '--'}</span>
                        <span className="text-sm font-medium text-[var(--text-muted)]">{unit}</span>
                    </div>
                    <div className="mt-3 flex items-center gap-1.5 text-xs font-medium">
                        <span className={isPositive ? 'text-emerald-500' : 'text-amber-500'}>
                            {trend?.type === 'up' ? '↑' : trend?.type === 'down' ? '↓' : '●'} {trend?.text || 'Dáta pripravené'}
                        </span>
                    </div>
                </div>
            );
        }

        // --- SUB-KOMPONENT: DYNAMICKÝ SVG GRAF ---
        function DynamicHistoryChart({ metricName, historyData = [], unit }) {
            if (!historyData || historyData.length === 0) {
                return <p className="text-xs text-[var(--text-muted)] italic p-4">Pre túto veličinu momentálne nie sú na serveri dostupné historické záznamy.</p>;
            }

            const width = 600;
            const height = 220;
            const padding = 40;

            const maxX = historyData.length - 1 || 1;
            const values = historyData.map(d => d?.value ?? d ?? 0);
            const minY = Math.min(...values) - (Math.min(...values) * 0.1 || 1);
            const maxY = Math.max(...values) + (Math.max(...values) * 0.1 || 1);

            const points = historyData.map((d, index) => {
                const val = d?.value ?? d ?? 0;
                const label = d?.time || d?.label || `${index}:00`;
                const x = padding + (index / maxX) * (width - padding * 2);
                const y = height - padding - ((val - minY) / ((maxY - minY) || 1)) * (height - padding * 2);
                return { x, y, label, val };
            });

            const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');
            const areaD = points.length > 0 ? `${pathD} L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z` : '';

            return (
                <div className="w-full bg-slate-50 dark:bg-slate-900/40 p-4 rounded-xl border border-dashed border-[var(--border-color)]">
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-xs uppercase tracking-wider font-bold text-[var(--text-muted)]">História: {metricName}</span>
                        <span className="text-xs bg-sky-500/10 text-sky-500 px-2.5 py-1 rounded-full font-semibold">Live stream</span>
                    </div>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
                        <defs>
                            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="var(--color-accent)" stopOpacity={0.25} />
                                <stop offset="100%" stopColor="var(--color-accent)" stopOpacity={0} />
                            </linearGradient>
                        </defs>
                        
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="var(--border-color)" strokeWidth={1} strokeDasharray="4" opacity={0.5} />
                        <line x1={padding} y1={height/2} x2={width-padding} y2={height/2} stroke="var(--border-color)" strokeWidth={1} strokeDasharray="4" opacity="0.5" />
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="var(--border-color)" strokeWidth={1} opacity="0.5" />

                        {points.length > 0 && <path d={areaD} fill="url(#chartGradient)" />}
                        {points.length > 0 && <path d={pathD} fill="none" stroke="var(--color-accent)" strokeWidth={3} strokeLinecap="round" />}
                        
                        {points.map((p, i) => (
                            <g key={i} className="group/point cursor-pointer">
                                <circle cx={p.x} cy={p.y} r={5} fill="var(--bg-card)" stroke="var(--color-accent)" strokeWidth={2} />
                                <circle cx={p.x} cy={p.y} r="9" fill="var(--color-accent)" opacity="0" className="hover:opacity-20 transition-opacity" />
                                <text x={p.x} y={p.y - 12} fill="var(--text-main)" fontSize={11} fontWeight="600" textAnchor="middle" className="opacity-0 group-hover/point:opacity-100 transition-opacity">
                                    {p.val}{unit}
                                </text>
                                <text x={p.x} y={height - 15} fill="var(--text-muted)" fontSize={10} textAnchor="middle">
                                    {p.label}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        }

        // --- HLAVNÁ APLIKÁCIA ---
        function GaiaSenzorApp() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedMetric, setSelectedMetric] = React.useState('temperature');
            
            // Bezpečné východiskové dáta
            const [data, setData] = React.useState({
                station_name: "GaiaSenzor Core v2",
                location: "Bratislava, Slovensko",
                metrics: {
                    temperature: { title: "Teplota vzduchu", value: 17.6, unit: "°C", icon: "🌡️", trend: { text: "Stabilná", type: "good" }, history: [] },
                    humidity: { title: "Vlhkosť vonku", value: 68, unit: "%", icon: "💧", trend: { text: "Mierne stúpa", type: "up" }, history: [] },
                    pressure: { title: "Atmosférický tlak", value: 1016, unit: "hPa", icon: "⏱️", trend: { text: "V norme", type: "good" }, history: [] },
                    ghi: { title: "Solárne žiarenie GHI", value: 512, unit: "W/m²", icon: "☀️", trend: { text: "Jasno", type: "good" }, history: [] },
                    wind: { title: "Rýchlosť vetra", value: 18, unit: "km/h", icon: "💨", trend: { text: "Čerstvý vietor", type: "warn" }, history: [] },
                    rain: { title: "Zrážky (1h)", value: 0.2, unit: "mm", icon: "🌧️", trend: { text: "Prehánky", type: "warn" }, history: [] }
                },
                classrooms: []
            });

            React.useEffect(() => {
                fetch('https://meteorological-project.onrender.com/api/dashboard')
                    .then(response => {
                        if (!response.ok) throw new Error("Chyba servera");
                        return response.json();
                    })
                    .then(realData => {
                        // TOTO JE KĽÚČOVÉ: Vypíšeme si reálnu štruktúru zo servera do konzoly
                        console.log("👉 RESPONS ZO SERVERA:", realData);

                        setData(prev => {
                            // Ak server poslal objekt, ktorý má priamo v sebe vlastnosť metrics
                            if (realData && typeof realData === 'object' && realData.metrics) {
                                return { ...prev, ...realData };
                            }

                            // Inteligentný fallback pre plochý JSON (napr. {temperature: 21, humidity: 45})
                            const updatedMetrics = { ...prev.metrics };
                            const source = Array.isArray(realData) ? realData[realData.length - 1] : realData;

                            if (source && typeof source === 'object') {
                                Object.keys(updatedMetrics).forEach(key => {
                                    if (source[key] !== undefined) {
                                        updatedMetrics[key] = { ...updatedMetrics[key], value: source[key] };
                                    }
                                });
                            }

                            return {
                                ...prev,
                                location: source?.location || source?.station_name || prev.location,
                                metrics: updatedMetrics,
                                classrooms: realData?.classrooms || prev.classrooms
                            };
                        });
                    })
                    .catch(error => {
                        console.error("Fetch zlyhal, aplikácia beží v simulačnom režime:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            const metricsObj = data?.metrics || {};
            const classroomsList = data?.classrooms || [];
            const criticalRooms = classroomsList.filter(r => (r?.co2 || 0) > 1200);
            
            const globalStatus = criticalRooms.length > 0
                ? { message: `⚠️ Pozor: Zvýšené CO2 v triedach: ${criticalRooms.map(r => r.id || r.name).join(', ')}.`, type: "warn" }
                : { message: "✨ Klíma v budove školy je v norme.", type: "good" };

            const activeMetricData = metricsObj[selectedMetric] || { title: selectedMetric, value: '--', unit: '', icon: '📊', history: [] };

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    <aside className="w-full lg:w-64 bg-slate-900 text-slate-100 p-6 flex flex-col justify-between border-r border-slate-800 shrink-0">
                        <div>
                            <div className="mb-10 flex items-center justify-between">
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">⚡ GaiaSenzor</h1>
                                    <p className="text-[10px] uppercase tracking-widest text-slate-400 mt-1 font-bold">Meteo Dashboard</p>
                                </div>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-800 text-amber-400">
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>
                            <nav className="space-y-1.5">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${activeTab === 'dashboard' ? 'bg-sky-500 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>📊 Riadiaci panel</button>
                                <button onClick={() => setActiveTab('rooms')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${activeTab === 'rooms' ? 'bg-sky-500 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>🏫 Interiér tried</button>
                            </nav>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-[var(--border-color)] pb-5">
                            <div>
                                <p className="text-xs uppercase tracking-wider font-bold text-sky-500">Aktuálny stav uzla</p>
                                <h2 className="text-2xl font-bold tracking-tight">{data?.location || "Načítavam..."}</h2>
                            </div>
                            <div className={`px-4 py-3 rounded-xl border text-sm font-medium ${globalStatus.type === 'warn' ? 'bg-amber-500/10 border-amber-500/20 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'}`}>
                                {globalStatus.message}
                            </div>
                        </div>

                        {activeTab === 'dashboard' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 space-y-4">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Meteostanica (Exteriér)</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {Object.keys(metricsObj).map(key => {
                                            const item = metricsObj[key];
                                            return (
                                                <MetricCard 
                                                    key={key}
                                                    title={item?.title || key}
                                                    value={item?.value}
                                                    unit={item?.unit || ''}
                                                    icon={item?.icon}
                                                    trend={item?.trend}
                                                    isSelected={selectedMetric === key}
                                                    onClick={() => setSelectedMetric(key)}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Detailná analýza</h3>
                                    <div className="custom-card p-6 rounded-2xl shadow-sm h-full flex flex-col justify-between gap-6">
                                        <div>
                                            <h4 className="font-bold text-lg">{activeMetricData.title}</h4>
                                            <div className="text-4xl font-extrabold my-4">{activeMetricData.value} <span className="text-lg font-normal text-[var(--text-muted)]">{activeMetricData.unit}</span></div>
                                        </div>
                                        <DynamicHistoryChart 
                                            metricName={activeMetricData.title}
                                            historyData={activeMetricData.history}
                                            unit={activeMetricData.unit}
                                        />
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">Monitorované učebne</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {classroomsList.map((room, index) => (
                                        <div key={room?.id || index} className="custom-card p-6 rounded-2xl shadow-sm">
                                            <h4 className="font-bold text-base">{room?.name || `Trieda ${room?.id}`}</h4>
                                            <p className="text-sm mt-2 text-[var(--text-muted)]">CO2: <span className="font-semibold text-[var(--text-main)]">{room?.co2 ?? '--'} ppm</span></p>
                                            <p className="text-sm text-[var(--text-muted)]">Teplota: <span className="font-semibold text-[var(--text-main)]">{room?.temperature ?? '--'} °C</span></p>
                                        </div>
                                    ))}
                                    {classroomsList.length === 0 && <p className="text-sm text-[var(--text-muted)] italic p-4">Učebne momentálne neposielajú žiadne dáta.</p>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GaiaSenzorApp />);
    </script>
</body>
</html>
