<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaSenzor - Boho Meteostanica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAF6F0] text-[#4A3F35] min-h-screen selection:bg-[#C96F53]/20">

    <div id="root"></div>

    <script type="text/babel">
        function BohoMeteoApp() {
            // Simulované živé dáta z meteostanice
            const [data, setData] = React.useState({
                weather: { 
                    temperature_out: 23.8, 
                    feels_like: 22.4,
                    humidity_out: 68, 
                    pressure: 1011, 
                    rain_1h: 1, 
                    ghi: 450,
                    condition: "Polojasno s prehánkami"
                },
                classrooms: [
                    { id: "A204", name: "Učebňa Informatiky (A204)", co2: 850, temperature: 21.8, humidity: 45, noise: 42, door_open: false, productivity_index: 88 },
                    { id: "B101", name: "Fyzikálne Laboratórium (B101)", co2: 1420, temperature: 24.1, humidity: 55, noise: 68, door_open: true, productivity_index: 45 },
                    { id: "C302", name: "Ateliér Estetiky (C302)", co2: 510, temperature: 20.5, humidity: 42, noise: 28, door_open: false, productivity_index: 96 }
                ]
            });

            const isRaining = data.weather.rain_1h > 0;
            
            // Výpočet obvodu kruhu pre vizuálny kruhový oblúk (Gauge)
            const radius = 120;
            const circumference = 2 * Math.PI * radius;
            // Predpokladáme max teplotu 40°C pre naplnenie kruhu
            const strokeDashoffset = circumference - (Math.min(data.weather.temperature_out, 40) / 40) * circumference;

            return (
                <div class="min-h-screen flex flex-col md:flex-row relative overflow-hidden p-4 md:p-10 gap-8">
                    
                    {/* EFEKT PADAJÚCEHO DAŽĎA NA POZADÍ */}
                    {isRaining && (
                        <div class="absolute inset-0 pointer-events-none opacity-20 z-0" style={{
                            backgroundImage: 'radial-gradient(circle at 50% 50%, #8A9A86 1px, transparent 1px)',
                            backgroundSize: '20px 140px',
                            animation: 'rain 0.6s linear infinite'
                        }}></div>
                    )}
                    
                    <div class="w-full max-w-5xl mx-auto z-10 space-y-10">
                        
                        {/* HLAVIČKA S LOKÁCIOU A DÁTUMOM */}
                        <header class="text-center space-y-1">
                            <h1 class="text-xs uppercase tracking-widest text-[#9A8D7E] font-bold">Školská meteostanica</h1>
                            <p class="text-2xl font-serif font-bold text-[#4A3F35]">Bratislava, Slovensko</p>
                            <p class="text-xs text-[#8A9A86] font-mono">Dnes, {new Date().toLocaleDateString('sk-SK')} • Živý prenos</p>
                        </header>

                        {/* HIGH-END KRUHOVÝ METEO INDIKÁTOR (Inšpirovaný tvojím obrázkom) */}
                        <div class="flex justify-center items-center relative my-6">
                            <div class="relative w-72 h-72 flex items-center justify-center bg-[#EFE8DC]/40 rounded-full border border-[#E6DCCE]/50 shadow-inner backdrop-blur-sm">
                                
                                <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                                    <circle 
                                        cx="144" cy="144" r="120" 
                                        stroke="#E6DCCE" stroke-width="2" stroke-dasharray="4 4"
                                        fill="transparent" 
                                    />
                                    <circle 
                                        cx="144" cy="144" r="120" 
                                        stroke="#C96F53" stroke-width="4" 
                                        stroke-linecap="round"
                                        stroke-dasharray={circumference} 
                                        stroke-dashoffset={strokeDashoffset}
                                        fill="transparent" 
                                        class="transition-all duration-1000 ease-out"
                                    />
                                </svg>

                                <div class="text-center z-10 space-y-1 px-6">
                                    <div class="text-2xl opacity-85">🌤️</div>
                                    
                                    <h2 class="text-6xl font-serif font-bold text-[#4A3F35] tracking-tighter relative inline-block">
                                        {data.weather.temperature_out}
                                        <span class="text-2xl font-sans font-light absolute -top-2 -right-6">°</span>
                                    </h2>
                                    
                                    <p class="text-sm text-[#7A6C5D] font-medium pt-1">
                                        Pocitovo <span class="font-serif italic font-bold">{data.weather.feels_like}°</span>
                                    </p>
                                    
                                    <p class="text-xs uppercase tracking-wider font-bold text-[#8A9A86] pt-2">
                                        {data.weather.condition}
                                    </p>
                                    
                                </div>
                            </div>
                        </div>

                        {/* SPODNÁ MRIEŽKA S EXTERNÝMI METRIKAMI */}
                        <section class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="bg-[#EFE8DC]/60 p-4 rounded-xl border border-[#E6DCCE] text-center shadow-sm">
                                <p class="text-[11px] uppercase tracking-wider font-bold text-[#9A8D7E]">Vlhkosť vzduchu</p>
                                <p class="text-xl font-serif font-bold text-[#4A3F35] mt-1">{data.weather.humidity_out}%</p>
                            </div>
                            <div class="bg-[#EFE8DC]/60 p-4 rounded-xl border border-[#E6DCCE] text-center shadow-sm">
                                <p class="text-[11px] uppercase tracking-wider font-bold text-[#9A8D7E]">Atmosférický tlak</p>
                                <p class="text-xl font-serif font-bold text-[#4A3F35] mt-1">{data.weather.pressure} hPa</p>
                            </div>
                            <div class="bg-[#EFE8DC]/60 p-4 rounded-xl border border-[#E6DCCE] text-center shadow-sm col-span-2 md:col-span-1">
                                <p class="text-[11px] uppercase tracking-wider font-bold text-[#9A8D7E]">Solárne žiarenie (GHI)</p>
                                <p class="text-xl font-serif font-bold text-[#4A3F35] mt-1">{data.weather.ghi} W/m²</p>
                            </div>
                        </section>

                        {/* INTERIÉROVÉ BUNKY / TRIEDY */}
                        <section class="space-y-4">
                            <h3 class="font-serif text-xl font-bold text-[#6E6053] border-b border-[#E6DCCE] pb-2">
                                Vnútorné prostredie školy
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {data.classrooms.map(room => {
                                    const isCritical = room.co2 > 1200;
                                    return (
                                        <div key={room.id} class={`p-6 rounded-2xl border transition-all duration-500 shadow-sm flex flex-col justify-between ${isCritical ? 'bg-[#A64B44] text-white border-[#8C3D37]' : 'bg-[#FDFBF7] border-[#E6DCCE]'}`}>
                                            <div>
                                                <div class="flex justify-between items-start">
                                                    <div>
                                                        <h4 class="font-serif font-bold text-base">{room.name}</h4>
                                                        <p class="text-[10px] uppercase opacity-60">ID: {room.id}</p>
                                                    </div>
                                                    <span class="text-lg">{room.door_open ? "🔓" : "🔒"}</span>
                                                </div>
                                                
                                                <div class="space-y-2 my-5 text-sm">
                                                    <div class="flex justify-between">
                                                        <span class="opacity-80">Oxid uhličitý:</span>
                                                        <span class="font-bold">{room.co2} ppm</span>
                                                    </div>
                                                    <div class="flex justify-between text-xs opacity-75">
                                                        <span>Klíma v triede:</span>
                                                        <span>{room.temperature}°C / {room.humidity}%</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="mt-2 pt-3 border-t border-current/10">
                                                <div class="flex justify-between text-[11px] uppercase font-bold opacity-80 mb-1">
                                                    <span>Index pozornosti</span>
                                                    <span>{room.productivity_index}%</span>
                                                </div>
                                                <div class="w-full h-1 bg-current/10 rounded-full overflow-hidden">
                                                    <div class="h-full bg-current rounded-full" style={{ width: `${room.productivity_index}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>
                        
                    </div>
                    <style>{`@keyframes rain { 0% { background-position: 0px 0px; } 100% { background-position: 20px 400px; } }`}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BohoMeteoApp />);
    </script>
</body>
</html>
